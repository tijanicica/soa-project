syntax = "proto3";

import "google/api/annotations.proto";

option go_package = "github.com/tijanicica/soa-project/protos";

package stakeholders;

//grpc komunikacija od gatewaya do servisa

// Poruka za login zahtev
message LoginRequest {
  string username = 1;
  string password = 2;
}

// Poruka za odgovor sa tokenom
message LoginResponse {
  string token = 1;
  int64 user_id = 2;
}

// Zahtev za registraciju
message RegisterRequest {
  string username = 1;
  string password = 2;
  string email = 3;
  string role = 4; // 'tourist' or 'guide'
}
// Odgovor nakon registracije
message RegisterResponse {
  string message = 1;
}

// Servis koji blog-service (i drugi) može da pozove
service StakeholderService {
  // Metoda koja vraća informacije o više korisnika
  rpc GetUsersInfo (GetUsersInfoRequest) returns (GetUsersInfoResponse);

  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      // Kada stigne POST na ovu putanju...
      post: "/login"
      // ... koristi sve iz tela (*) kao poruku
      body: "*"
    };
  }

  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/register",
      body: "*"
    };
  }

}

// Poruka koja se šalje kao zahtev
message GetUsersInfoRequest {
  repeated int64 user_ids = 1;
}

// Poruka sa informacijama o jednom korisniku
message UserInfo {
  int64 id = 1;
  string username = 2;
  string first_name = 3;
  string profile_image_url = 4;
}

// Poruka koja se vraća kao odgovor (mapa ID-jeva u UserInfo)
message GetUsersInfoResponse {
  map<int64, UserInfo> users = 1;
}